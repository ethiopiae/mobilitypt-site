services:
  - slug: back-neck-pain
    url: /services/back-neck-pain/
    title: Back and neck pain
    summary: Spine care for the neck, mid-back and low back. Less pain now, and habits that protect your back for life.
  - slug: post-surgery-rehab
    url: /services/post-surgery-rehab/
    title: Recovery after surgery
    summary: Safe, structured progressions after surgery to get your movement back and return to daily life with confidence.
  - slug: joint-pain-sprains-strains
    url: /services/joint-pain-sprains-strains/
    title: Joint pain, sprains and strains
    summary: Individual programs to restore mobility, improve strength and get you back to doing what you love.
  - slug: car-accident-injuries
    url: /services/car-accident-injuries/
    title: Car accident injuries
    summary: Back and neck injuries after a crash. We work with auto MedPay coverage.
  - slug: work-injuries
    url: /services/work-injuries/
    title: Work injuries
    summary: Rehab for on-the-job injuries, with workers' compensation accepted.
  - slug: education-prevention
    url: /about/#approach
    title: Education and prevention
    summary: You leave with your own exercises, stretches and health strategies to prevent the next injury.
