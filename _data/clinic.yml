testimonials:
  - name: Candice
    text: If you are looking for actual results and people that truly care about your wellbeing, look no further. I have been to several physical therapists before, but Mobility P.T. is the only one that has provided results and pain relief!
  - name: Tom
    text: My wife has been to many physical therapists over the last 30 years. No one even comes close to Mobility Physical Therapy in care. They have a five-star recommendation!
  - name: Susan
    text: Wonderful people who clearly love what they do. And I'm back to participating in the sports I love with confidence.
  - name: Gina
    text: If you need PT please ask your Dr. for a referral to Mobility Physical Therapy. I promise, you will not regret it!
  - name: Samantha
    text: Awesome physical therapy spot! All of the staff are very knowledgeable and helpful.

